# /etc/nginx/conf.d/ash-relay.conf: TLS on 443, only the relay's API (/v1/) goes through; nothing else is served.
# Replace 203.0.113.7 with the address in /etc/default/ash-relay (the certificate's name, and the Host the relay sees).
map $http_upgrade $connection_upgrade { default upgrade; "" close; }
server {
    listen 443 ssl;

    server_name _;
    ssl_certificate     /etc/letsencrypt/live/203.0.113.7/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203.0.113.7/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 203.0.113.7;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { return 404; }
}
